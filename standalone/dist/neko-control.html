<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neko Control</title>
  <style>:root {
  color-scheme: light;
  --ink: #241b2f;
  --muted: #7d7287;
  --line: #eee6ef;
  --panel: #ffffff;
  --canvas: #fffafd;
  --pink: #d83e80;
  --pink-soft: #fff0f7;
  --danger: #b43c58;
  --success: #287b5b;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--canvas); }
button, input { font: inherit; }
button { cursor: pointer; }
.auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 20%, #fff 0, var(--canvas) 58%); }
.auth-card { width: min(100%, 420px); padding: 40px; border: 1px solid var(--line); border-radius: 24px; background: var(--panel); box-shadow: 0 24px 70px #5c315319; }
.brand-mark { color: var(--pink); font-size: 12px; font-weight: 800; letter-spacing: .18em; }
.auth-card h1 { margin: 14px 0 8px; font-size: 30px; }
.muted { color: var(--muted); }
.stack { display: grid; gap: 12px; margin-top: 26px; }
label { display: grid; gap: 6px; color: #5f5468; font-size: 13px; font-weight: 650; }
input { width: 100%; padding: 11px 12px; border: 1px solid #ddd1df; border-radius: 10px; background: #fff; color: var(--ink); outline: none; }
input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px #d83e801a; }
.button { border: 1px solid #ded3e0; border-radius: 10px; padding: 10px 14px; background: white; color: var(--ink); font-weight: 700; }
.button:hover { border-color: #c8b6cb; }
.button-primary { border-color: var(--pink); background: var(--pink); color: white; }
.button-danger { border-color: #f0b9c7; background: #fff5f7; color: var(--danger); }
.button-success { border-color: #b7e0cc; background: #f1fff7; color: var(--success); }
.button-ghost { border-color: transparent; background: transparent; color: #6f6375; }
.button-small { padding: 6px 9px; font-size: 12px; }
.form-error { color: var(--danger); font-size: 13px; }
.app-shell { min-height: 100vh; display: grid; grid-template-columns: 248px 1fr; }
.sidebar { display: flex; flex-direction: column; gap: 28px; padding: 28px 18px; border-right: 1px solid var(--line); background: #fff; }
.brand-subtitle { margin-top: 6px; color: var(--muted); font-size: 12px; }
.nav { display: grid; gap: 7px; }
.nav-item { border: 0; border-radius: 10px; padding: 11px 12px; background: transparent; color: #75697a; text-align: left; }
.nav-item:hover, .nav-item.is-active { background: var(--pink-soft); color: var(--pink); font-weight: 750; }
.sidebar-footer { display: grid; gap: 10px; margin-top: auto; }
.admin-label { color: var(--muted); font-size: 12px; }
.main { min-width: 0; padding: 30px clamp(20px, 4vw, 58px) 60px; }
.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
.eyebrow { color: var(--pink); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.topbar h1 { margin: 5px 0 0; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.04em; }
.local-chip { padding: 7px 10px; border: 1px solid #b7e0cc; border-radius: 999px; background: #f1fff7; color: var(--success); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
.section-head, .panel-title-row { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 18px; }
.section-head h2 { margin: 0; font-size: 24px; }
.section-head p { margin: 6px 0 0; }
.stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card, .panel { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 12px 32px #5c31530b; }
.stat-card { padding: 20px; }
.stat-card span { color: var(--muted); font-size: 13px; }
.stat-card strong { display: block; margin-top: 10px; font-size: 34px; letter-spacing: -.04em; }
.stat-users strong { color: #8b4eb1; }.stat-product strong { color: #b25c91; }.stat-active strong { color: #2c8a67; }.stat-device strong { color: #7a6bb3; }.stat-session strong { color: #3f76b7; }.stat-coupon strong { color: #cf7150; }
.panel { padding: 20px; margin-bottom: 18px; }
.panel h3 { margin: 0; font-size: 17px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; min-width: 700px; }
th, td { padding: 12px 13px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; font-size: 13px; }
th { background: #fffbfe; color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
tr:last-child td { border-bottom: 0; }
.primary-cell { color: var(--ink); font-weight: 700; }
.date-cell { white-space: nowrap; color: var(--muted); }
.actions { white-space: nowrap; }
.status { display: inline-flex; padding: 4px 8px; border-radius: 999px; background: #f5f2f6; color: #766c7a; font-size: 11px; font-weight: 750; }
.status-active, .status-success { background: #effbf5; color: var(--success); }.status-redeemed, .status-revoked, .status-rejected, .status-inactive { background: #fff3f5; color: var(--danger); }.status-suspended { background: #fff8e7; color: #a46c1a; }
.empty { padding: 28px; color: var(--muted); text-align: center; }
.inline-form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: end; }
.form-actions { display: flex; gap: 8px; }
.toast { position: fixed; right: 24px; bottom: 24px; max-width: min(420px, calc(100vw - 48px)); padding: 12px 15px; border-radius: 10px; background: #2a2330; color: white; box-shadow: 0 14px 35px #2a233033; font-size: 13px; }
.toast-error { background: var(--danger); }.toast-success { background: var(--success); }
@media (max-width: 900px) { .app-shell { grid-template-columns: 1fr; }.sidebar { border-right: 0; border-bottom: 1px solid var(--line); padding: 18px; }.nav { display: flex; overflow-x: auto; }.nav-item { white-space: nowrap; }.sidebar-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 0; }.stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }.inline-form { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .main { padding: 22px 14px 44px; }.auth-card { padding: 28px 22px; }.stats-grid, .inline-form { grid-template-columns: 1fr; }.topbar { display: block; }.local-chip { display: inline-block; margin-top: 14px; } }
</style></head>
