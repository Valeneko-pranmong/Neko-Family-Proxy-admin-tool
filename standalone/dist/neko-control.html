  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

:root {
  color-scheme: light dark;

  /* Typography */
  --font-sans: "Prompt", "Noto Sans Thai Looped", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-family: var(--font-sans);

  /* Layout */
  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --sidebar-w: 260px;
  --ring: 0 0 0 3px rgba(37, 99, 235, 0.2);

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --t-fast: 140ms var(--ease-out);
  --t-med: 220ms var(--ease-out);

  /* Modern SaaS Brand Colors (Electric Blue & Indigo) */
  --brand-600: #1d4ed8;
  --brand-500: #2563eb;
  --brand-400: #3b82f6;

  /* Legacy aliases for compatibility */
  --pink-600: var(--brand-600);
  --pink-500: var(--brand-500);
  --pink-400: var(--brand-400);

  /* Semantic chart colors */
  --c-rx: #2563eb;
  --c-tx: #059669;
  --c-ping: #0891b2;
  --c-degraded: #ef4444;
}

html[data-theme="light"] {
  color-scheme: light;
  --ink: #0f172a;
  --ink-strong: #020617;
  --muted: #64748b;
  --line: #e2e8f0;
  --line-soft: #f1f5f9;
  --panel: #ffffff;
  --canvas: #f8fafc;
  --canvas-accent: #f8fafc;
  --pink: var(--brand-500);
  --pink-ink: var(--brand-600);
  --pink-soft: #eff6ff;
  --danger: #dc2626;
  --danger-soft: #fef2f2;
  --success: #059669;
  --success-soft: #ecfdf5;
  --blue: #2563eb;
  --blue-soft: #eff6ff;
  --warn-ink: #b45309;
  --warn-soft: #fef3c7;
  --shadow-panel: 0 1px 3px rgba(15, 23, 42, 0.04), 0 4px 12px rgba(15, 23, 42, 0.02);
  --shadow-pop: 0 12px 32px -4px rgba(15, 23, 42, 0.12), 0 4px 12px rgba(15, 23, 42, 0.05);
  --th-bg: #f8fafc;
  --row-hover: #f8fafc;
  --skeleton-a: #f1f5f9;
  --skeleton-b: #ffffff;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --ink: #f1f5f9;
  --ink-strong: #ffffff;
  --muted: #94a3b8;
  --line: #1e293b;
  --line-soft: #1e293b90;
  --panel: #0f172a;
  --canvas: #090d16;
  --canvas-accent: #141c2e;
  --pink: var(--brand-400);
  --pink-ink: #60a5fa;
  --pink-soft: #1e293b;
  --danger: #f87171;
  --danger-soft: #450a0a40;
  --success: #34d399;
  --success-soft: #064e3b40;
  --blue: #60a5fa;
  --blue-soft: #1e3a8a30;
  --warn-ink: #fbbf24;
  --warn-soft: #451a0340;
  --shadow-panel: 0 1px 3px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.3);
  --shadow-pop: 0 16px 40px -6px rgba(0, 0, 0, 0.6);
  --th-bg: #141c2e;
  --row-hover: #141c2e80;
  --skeleton-a: #141c2e;
  --skeleton-b: #1e293b;
}

/* ---------- Base ---------- */

* { box-sizing: border-box; }
html, body {
  min-height: 100%;
  margin: 0;
  color: var(--ink);
  background: var(--canvas);
  font-feature-settings: "cv02", "cv03", "cv04", "cv11", "tnum";
  -webkit-font-smoothing: antialiased;
  transition: background-color 220ms var(--ease-out), color 220ms var(--ease-out);
}
button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex="0"]:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
::selection { background: rgba(37, 99, 235, 0.2); }

.muted { color: var(--muted); }

/* ---------- Login ---------- */

.auth-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(1100px 520px at 85% -10%, rgba(37, 99, 235, 0.08) 0%, transparent 60%),
    radial-gradient(900px 500px at 0% 110%, rgba(139, 92, 246, 0.06) 0%, transparent 55%),
    radial-gradient(circle at 50% 20%, var(--canvas-accent) 0%, var(--canvas) 60%);
}
.auth-page::before,
.auth-page::after {
  content: "";
  position: absolute;
  width: 440px;
  height: 440px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.3;
  pointer-events: none;
}
.auth-page::before { top: -160px; right: -120px; background: rgba(37, 99, 235, 0.2); }
.auth-page::after { bottom: -180px; left: -140px; background: rgba(139, 92, 246, 0.15); }

.auth-card {
  position: relative;
  z-index: 1;
  width: min(100%, 420px);
  padding: 40px 36px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--panel);
  box-shadow: var(--shadow-pop);
  animation: card-in 380ms var(--ease-out) both;
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(12px) scale(0.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }

.brand-mark {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  border-radius: 10px;
  color: white;
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.28);
}
.brand-mark-text {
  color: var(--ink);
  font-family: "Inter", sans-serif;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.04em;
}

.auth-card h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.025em; color: var(--ink-strong); }
.auth-card .auth-sub { margin: 0 0 4px; font-size: 13.5px; line-height: 1.6; }
.stack { display: grid; gap: 14px; margin-top: 24px; }

label { display: grid; gap: 6px; color: var(--ink); font-size: 13px; font-weight: 600; }

.field { position: relative; }
.field input { padding-right: 44px; }
input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--ink);
  outline: none;
  font-size: 13.5px;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
input::placeholder { color: var(--muted); opacity: 0.75; }
input:hover:not(:focus):not(:disabled) { border-color: #cbd5e1; }
input:focus { border-color: var(--pink); box-shadow: var(--ring); }
input:disabled { opacity: 0.6; }

.password-toggle {
  position: absolute;
  inset-block: 0;
  right: 4px;
  margin: auto;
  height: calc(100% - 8px);
  min-width: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: var(--radius-xs);
  background: transparent;
  color: var(--muted);
  transition: color var(--t-fast), background-color var(--t-fast);
}
.password-toggle:hover { color: var(--ink); background: var(--line-soft); }
.password-toggle .eye-open { display: inline; }
.password-toggle .eye-closed { display: none; }
.password-toggle.is-visible .eye-open { display: none; }
.password-toggle.is-visible .eye-closed { display: inline; }
.password-toggle[aria-label] svg { pointer-events: none; }

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  background: var(--panel);
  color: var(--ink);
  font-weight: 600;
  font-size: 13px;
  transition: background-color var(--t-fast), border-color var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast), color var(--t-fast);
}
.button:hover:not(:disabled):not(:active) { border-color: #cbd5e1; background: var(--line-soft); }
.button:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
.button:disabled { opacity: 0.55; cursor: not-allowed; }

.button-primary {
  border-color: transparent;
  background: #2563eb;
  color: white;
  padding-block: 10px;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
}
.button-primary:hover:not(:disabled):not(:active) { background: #1d4ed8; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35); }

.button-danger { border-color: #fecaca; background: #fef2f2; color: #dc2626; }
.button-danger:hover:not(:disabled) { background: #fee2e2; }
.button-warning { border-color: #fde68a; background: #fef3c7; color: #b45309; }
.button-warning:hover:not(:disabled) { background: #fde68a; }
.button-success { border-color: #a7f3d0; background: #ecfdf5; color: #059669; }
.button-success:hover:not(:disabled) { background: #d1fae5; }
.button-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.button-ghost:hover:not(:disabled):not(:active) { background: var(--line-soft); color: var(--ink); box-shadow: none; }
.button-small { padding: 5px 10px; font-size: 12px; border-radius: var(--radius-xs); }

.form-error {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid #fecaca;
  border-radius: var(--radius-sm);
  background: #fef2f2;
  color: var(--danger);
  font-size: 12.5px;
}
.form-error[hidden] { display: none; }
.form-error::before { content: "⚠"; flex: 0 0 auto; }

.auth-footnote { margin-top: 22px; text-align: center; color: var(--muted); font-size: 11.5px; }

/* Theme toggle (login + shell) */
.theme-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--muted);
  transition: color var(--t-fast), border-color var(--t-fast), background-color var(--t-fast);
}
.theme-toggle:hover { color: var(--ink); border-color: #cbd5e1; }
.theme-toggle .icon-moon { display: inline; }
.theme-toggle .icon-sun { display: none; }
html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
html[data-theme="dark"] .theme-toggle .icon-sun { display: inline; }
.theme-toggle svg { pointer-events: none; }
.theme-toggle-floating { position: absolute; top: 20px; right: 22px; z-index: 2; }

/* ---------- App shell ---------- */

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  background: var(--canvas);
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 24px 16px 20px;
  border-right: 1px solid var(--line);
  background: var(--panel);
}

.brand { display: grid; gap: 8px; padding-inline: 4px; }
.brand-row { display: flex; align-items: center; gap: 10px; }
.brand-subtitle { color: var(--muted); font-size: 11px; letter-spacing: 0.02em; font-family: "Inter", sans-serif; font-weight: 500; }

.nav { display: grid; gap: 4px; }
.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  background: transparent;
  color: #475569;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  transition: background-color var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.nav-item span { display: grid; width: 18px; height: 18px; place-items: center; color: var(--muted); font-size: 14px; }
.nav-item:hover { background: var(--line-soft); color: var(--ink); }
.nav-item.is-active {
  background: var(--pink-soft);
  border-color: #dbeafe;
  color: #1d4ed8;
  font-weight: 600;
}
html[data-theme="dark"] .nav-item.is-active {
  background: #1e293b;
  border-color: #334155;
  color: #60a5fa;
}
.nav-item.is-active span { color: #2563eb; }
html[data-theme="dark"] .nav-item.is-active span { color: #60a5fa; }

.sidebar-footer { display: grid; gap: 10px; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line-soft); }
.admin-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--canvas-accent);
}
.avatar {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  flex: 0 0 auto;
  border-radius: 50%;
  color: white;
  font-size: 12px;
  font-weight: 700;
  background: #0f172a;
}
html[data-theme="dark"] .avatar { background: #334155; }
.admin-meta { display: grid; min-width: 0; gap: 2px; }
.admin-label { color: var(--ink); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-role { color: var(--muted); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; display: flex; align-items: center; gap: 4px; }
.admin-role::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
.admin-actions-row { display: flex; gap: 8px; align-items: center; }
.admin-actions-row .theme-toggle { margin-left: auto; }
.admin-actions-row [data-action="logout"] { flex: 1; }

.main { min-width: 0; padding: 28px clamp(20px, 3.5vw, 48px) 60px; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  max-width: 1240px;
  margin-bottom: 24px;
}
.topbar h1 { margin: 2px 0 0; font-size: clamp(24px, 3vw, 30px); letter-spacing: -0.025em; color: var(--ink-strong); font-weight: 700; }
.eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

.deployment-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border: 1px solid #a7f3d0;
  border-radius: var(--radius-pill);
  background: var(--success-soft);
  color: #065f46;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  white-space: nowrap;
}
html[data-theme="dark"] .deployment-chip { border-color: #064e3b; color: #34d399; }
.deployment-chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ---------- Section headers & status ---------- */

.section-head, .panel-title-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
.section-head h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; font-weight: 700; }
.section-head p { margin: 4px 0 0; font-size: 12px; }
.dashboard-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 20px; }
.dashboard-head h2 { margin: 6px 0 4px; font-size: clamp(22px, 2.5vw, 28px); letter-spacing: -0.025em; font-weight: 700; }
.dashboard-head p { margin: 0; font-size: 12.5px; }
.system-status { display: inline-flex; align-items: center; gap: 6px; color: var(--success); font-size: 11.5px; font-weight: 650; }
.system-status i { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
.refresh-meta { display: grid; justify-items: end; gap: 4px; color: var(--muted); font-size: 11.5px; }
.refresh-meta > div { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.refreshing { color: var(--pink); font-weight: 600; }
.inline-refresh { margin-bottom: 14px; color: var(--pink); font-size: 12.5px; font-weight: 600; }
.inline-alert {
  margin-bottom: 14px;
  padding: 10px 14px;
  border: 1px solid #fde68a;
  border-radius: var(--radius-sm);
  background: var(--warn-soft);
  color: var(--warn-ink);
  font-size: 12.5px;
}
.section-title-divider { margin: 24px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.section-title-divider h3 { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }

/* ---------- Stats & panels ---------- */

.stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card, .panel {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--panel);
  box-shadow: var(--shadow-panel);
}
.stat-card {
  position: relative;
  overflow: hidden;
  min-height: 160px;
  padding: 18px 20px;
  transition: transform var(--t-med), box-shadow var(--t-med), border-color var(--t-med);
}
.stat-card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 3px;
  background: var(--accent-top, var(--brand-500));
  opacity: 0.85;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-pop); border-color: #cbd5e1; }
.stat-card span { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.stat-card strong { display: block; margin-top: 6px; font-size: 30px; letter-spacing: -0.03em; color: var(--ink-strong); font-weight: 700; font-family: "Inter", sans-serif; }
.stat-card p { min-height: 32px; margin: 8px 0 8px; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
.stat-card small { color: var(--text-subtle, #94a3b8); font-size: 11px; }

.stat-users { --accent-top: #8b5cf6; }
.stat-active { --accent-top: #10b981; }
.stat-session { --accent-top: #2563eb; }
.stat-online { --accent-top: #059669; }
.stat-device { --accent-top: #6366f1; }
.stat-coupon { --accent-top: #f59e0b; }

.panel { padding: 20px 22px; margin-bottom: 18px; transition: border-color var(--t-med), box-shadow var(--t-med); }
.panel:hover { border-color: #cbd5e1; }
.panel h3 { margin: 0; font-size: 15.5px; letter-spacing: -0.01em; font-weight: 600; }
.panel-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pink); margin-bottom: 3px; }
.panel-title-row p { margin: 4px 0 0; font-size: 11.5px; }

/* ---------- Server health ---------- */

.server-health-panel { border-top: 1px solid var(--line); }
.server-status-badge { display: flex; align-items: center; gap: 8px; }
.server-stale-warn {
  color: var(--warn-ink);
  font-size: 11px;
  font-weight: 700;
  background: var(--warn-soft);
  border: 1px solid #fde68a;
  padding: 3px 8px;
  border-radius: var(--radius-xs);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.server-metrics-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.server-metric-card {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--canvas-accent);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: border-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast);
}
.server-metric-card:hover { border-color: #cbd5e1; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04); transform: translateY(-1px); }
.metric-label { color: var(--muted); font-size: 11.5px; font-weight: 600; }
.metric-value { font-size: 20px; font-weight: 700; color: var(--ink-strong); font-family: "Inter", sans-serif; display: flex; align-items: center; gap: 6px; }
.metric-value.rx-value { color: var(--c-rx); }
.metric-value.tx-value { color: var(--c-tx); }
.metric-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }

.server-details-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  margin-top: 14px;
  padding: 10px 14px;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  background: var(--row-hover);
}
.detail-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
.detail-label { color: var(--muted); font-weight: 600; }
.detail-value { color: var(--ink); font-weight: 650; }
.server-id-chip { font-family: var(--font-mono); font-size: 10.5px; background: var(--pink-soft); color: var(--pink); padding: 2px 6px; border-radius: 4px; }

/* ---------- Charts ---------- */

.live-chart-panel { min-height: 340px; }
.chart-meta-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.live-chart-legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 10px; color: var(--muted); font-size: 11.5px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.legend-rx, .legend-sessions { background: var(--c-rx); }
.legend-tx, .legend-redemptions { background: var(--c-tx); }
.legend-ping { background: var(--c-ping); }
.legend-degraded { background: var(--c-degraded); }
.legend-alert { color: var(--danger); font-weight: 600; }
.live-status-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 650;
  background: var(--row-hover);
  color: var(--muted);
}
.live-status-tag.status-live { background: var(--success-soft); color: var(--success); border: 1px solid #a7f3d0; }
.live-status-tag.status-stale { background: var(--warn-soft); color: var(--warn-ink); border: 1px solid #fde68a; }
.chart-stale-alert { margin: 0 0 12px; font-size: 12px; }

.chart-panel { min-height: 390px; }
.range-switch { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--canvas-accent); gap: 2px; }
.range-switch button {
  border: 0;
  border-radius: 6px;
  padding: 5px 9px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 650;
  font-family: "Inter", sans-serif;
  cursor: pointer;
  transition: background-color var(--t-fast), color var(--t-fast);
}
.range-switch button:focus-visible { outline: 2px solid var(--pink); outline-offset: 1px; }
.range-switch button.is-selected { background: var(--panel); color: var(--ink-strong); box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08); font-weight: 700; }
.chart-legend { display: flex; gap: 16px; margin-bottom: 8px; color: var(--muted); font-size: 11.5px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 8px; height: 8px; border-radius: 50%; }
.chart-wrap { min-height: 240px; overflow: hidden; }
.activity-chart { display: block; width: 100%; min-width: 560px; height: auto; }
.activity-chart text { fill: var(--muted); font-size: 10px; font-family: "Inter", sans-serif; }
.activity-chart circle { cursor: help; stroke: var(--panel); stroke-width: 2; transition: r 0.1s ease; }
.activity-chart circle:hover, .activity-chart circle:focus { r: 6; }
.activity-chart .chart-dot-pulse {
  pointer-events: none;
  stroke: none;
  animation: chartPulseAnim 2.4s infinite ease-out;
  transform-box: fill-box;
  transform-origin: center;
}
@keyframes chartPulseAnim {
  0% { r: 4px; opacity: 0.5; }
  50% { r: 9px; opacity: 0.15; }
  100% { r: 12px; opacity: 0; }
}
.chart-area { pointer-events: none; }
.chart-curve { pointer-events: stroke; transition: stroke-width var(--t-fast); }
.chart-curve:hover { stroke-width: 3.5; }
.chart-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.8; }
.chart-axis { stroke: var(--line); stroke-width: 1; }
.chart-max { font-weight: 600; }
.chart-empty { min-height: 200px; display: grid; place-content: center; gap: 6px; color: var(--muted); text-align: center; }
.chart-empty strong { color: var(--ink); font-size: 14px; }
.chart-empty span { font-size: 11.5px; }

/* ---------- Ops / tables ---------- */

.ops-grid { min-width: 0; display: grid; grid-template-columns: minmax(260px, 0.7fr) minmax(0, 1.3fr); gap: 16px; }
.ops-grid > * { min-width: 0; }
.ops-summary dl { margin: 14px 0 0; }
.ops-summary dl div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.ops-summary dl div:last-child { border: 0; }
.ops-summary dt { color: var(--muted); font-size: 12px; }
.ops-summary dd { margin: 0; font-weight: 700; font-family: "Inter", sans-serif; }
.table-wrap { max-height: 70vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--panel); scrollbar-width: thin; }
table { width: 100%; border-collapse: collapse; min-width: 700px; }
th, td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: middle; font-size: 12.5px; }
th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--th-bg);
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
tbody tr { transition: background-color var(--t-fast); }
tbody tr:hover { background: var(--row-hover); }
tr:last-child td { border-bottom: 0; }
.primary-cell { color: var(--ink-strong); font-weight: 600; }
.date-cell { white-space: nowrap; color: var(--muted); font-family: "Inter", sans-serif; font-size: 11.5px; }
.actions { white-space: nowrap; }
.truncated-id { cursor: help; border-bottom: 1px dotted var(--muted); font-family: var(--font-mono); }
.copyable-cell { cursor: copy; }
.copyable-cell:hover { color: var(--pink); border-bottom-color: var(--pink); }

/* ---------- Status badges ---------- */

.status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  background: var(--row-hover);
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 700;
  font-family: "Inter", sans-serif;
  text-transform: capitalize;
}
.status-glyph { font-size: 0.85em; }
.status-active, .status-success, .status-online, .status-listening, .status-available { background: var(--success-soft); color: var(--success); border-color: #a7f3d0; }
html[data-theme="dark"] .status-active, html[data-theme="dark"] .status-online { border-color: #064e3b; }
.status-redeemed, .status-revoked, .status-rejected, .status-banned, .status-expired, .status-closed, .status-failed, .status-timeout, .status-offline { background: var(--danger-soft); color: var(--danger); border-color: #fecaca; }
html[data-theme="dark"] .status-revoked, html[data-theme="dark"] .status-banned { border-color: #7f1d1d; }
.status-suspended, .status-expiring, .status-scheduled, .status-degraded, .status-stale { background: var(--warn-soft); color: var(--warn-ink); border-color: #fde68a; }
.status-inactive, .status-remembered, .status-unknown, .status-unsupported { background: var(--row-hover); color: var(--muted); border-color: var(--line); }

.empty { padding: 30px; color: var(--muted); text-align: center; font-size: 13px; }
.inline-form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: end; gap: 12px; }
.form-actions { display: flex; gap: 8px; }

/* ---------- Toast / modal ---------- */

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  max-width: min(400px, calc(100vw - 48px));
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: #0f172a;
  color: white;
  box-shadow: var(--shadow-pop);
  font-size: 13px;
  z-index: 50;
  animation: toast-in 240ms var(--ease-out);
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.toast-error { background: #991b1b; border-color: #b91c1c; }
.toast-success { background: #065f46; border-color: #047857; }

.modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); }
.modal-card {
  width: min(100%, 500px);
  padding: 26px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--panel);
  box-shadow: var(--shadow-pop);
  animation: card-in 260ms var(--ease-out);
}
.modal-card h2 { margin: 0 0 8px; font-size: 18px; }
.modal-card p { line-height: 1.6; font-size: 13px; }
.modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.temporary-password {
  display: block;
  margin: 16px 0;
  padding: 16px;
  overflow-wrap: anywhere;
  border: 1px dashed #f59e0b;
  border-radius: var(--radius-sm);
  background: var(--warn-soft);
  color: var(--ink-strong);
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-align: center;
  user-select: all;
}

.dashboard-skeleton { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.dashboard-skeleton div, .dashboard-skeleton section {
  min-height: 160px;
  border-radius: var(--radius-lg);
  background: linear-gradient(90deg, var(--skeleton-a) 25%, var(--skeleton-b) 50%, var(--skeleton-a) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
.dashboard-skeleton section { grid-column: 1 / -1; min-height: 350px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- Responsive ---------- */

@media (max-width: 900px) {
  .app-shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; gap: 14px; }
  .brand { padding-inline: 4px; }
  .nav { display: flex; max-width: 100%; overflow-x: auto; scrollbar-width: thin; }
  .nav-item { flex: 0 0 auto; white-space: nowrap; }
  .sidebar-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 0; }
  .admin-chip { border: 0; background: transparent; padding: 0; }
  .admin-actions-row { width: 100%; justify-content: flex-end; }
  .admin-actions-row [data-action="logout"] { flex: 0 0 auto; }
  .stats-grid, .dashboard-skeleton { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .server-metrics-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ops-grid { grid-template-columns: minmax(0, 1fr); }
  .inline-form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 600px) {
  .main { padding: 20px 14px 40px; }
  .auth-card { padding: 28px 20px; border-radius: var(--radius-md); }
  .stats-grid, .server-metrics-grid, .inline-form, .dashboard-skeleton { grid-template-columns: 1fr; }
  .stat-card { min-height: 140px; }
  .topbar, .dashboard-head, .panel-title-row { display: block; }
  .deployment-chip { display: inline-flex; margin-top: 12px; }
  .refresh-meta { justify-items: start; margin-top: 12px; }
  .range-switch { width: 100%; margin-top: 12px; }
  .range-switch button { flex: 1; }
  .chart-wrap { overflow-x: auto; }
  .panel { padding: 16px; }
  .modal-actions .button { flex: 1; }
  .sidebar-footer { align-items: flex-start; flex-direction: column; gap: 8px; }
}
